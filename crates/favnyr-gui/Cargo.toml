[package]
name = "favnyr-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Reads as the one-line summary of the Linux packages built from this crate,
# so it is written for whoever browses a package manager, not for a developer.
# No leading article: a package summary is a label, not a sentence.
description = "Modern and lightweight file manager"
publish = false   # application (never published to crates.io)

[[bin]]
name = "favnyr"
path = "src/main.rs"

[dependencies]
favnyr-core = { path = "../favnyr-core" }
slint       = { workspace = true }
tracing     = { workspace = true }
anyhow      = { workspace = true }
notify      = { workspace = true }
dirs        = { workspace = true }
open        = { workspace = true }
arboard     = { workspace = true }
toml        = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = { workspace = true }

# Native Windows integrations (Shell, COM/OLE, WinRT). Feature-gated to the
# APIs Favnyr actually calls; build-time bindings only, backed by system DLLs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    # Official WPD/MTP enumeration (Android) — system API, no third-party DLL.
    "Win32_Devices_PortableDevices",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    # IImageList / SHGetImageList — JUMBO extension icons (256 px, preview mode).
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    # File clipboard (CF_HDROP) — interop with Explorer.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # Native PDF thumbnails (Windows' built-in PDF engine) — WinRT, standalone.
    "Foundation",
    "Data_Pdf",
    "Storage",
    # StorageFolder::GetFolderFromPathAsync moved behind this generated feature
    # in windows 0.62 (used when sharing directories through the native sheet).
    "Storage_Search",
    "Storage_Streams",
    # Native Share sheet for the context-menu "Share" entry (WinRT).
    "ApplicationModel_DataTransfer",
] }
# `windows` 0.60+ split its COM/WinRT support into aligned sub-crates. They are
# named directly because `#[implement]` expands to `windows_core` paths and
# Favnyr turns Rust vectors into WinRT collections. Keep this trio aligned.
windows-core = "0.62.2"
windows-collections = { version = "0.3.2", default-features = false, features = ["std"] }

[build-dependencies]
slint-build = { workspace = true }

# Embeds the application icon (assets/favnyr.ico, derived from the SVG) into
# favnyr.exe via a Win32 resource (RT_GROUP_ICON). Native Windows build only
# (build scripts run on the host → cfg = host); uses rc.exe from the Windows
# SDK shipped with the MSVC toolchain.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Debian package description, read by the `cargo deb` tool. That tool is
# installed on the side and invoked by hand or by the release workflow, so it
# is not a dependency of the project and nothing here reaches `Cargo.lock`.
#
# The package is named after the binary rather than after this crate, and it
# carries exactly the three files the portable archive carries: the executable,
# the icon, and the desktop entry whose `Icon=favnyr` line dictates where the
# icon has to land.
[package.metadata.deb]
name = "favnyr"
maintainer = "GlitchAwakened <314985819+GlitchAwakened@users.noreply.github.com>"
copyright = "2025-2026, GlitchAwakened"
# A short notice rather than the licence itself: a Debian system already ships
# the GPL texts, and copying 35 kB of it into every package is what the policy
# asks to avoid.
license-file = ["../../packaging/debian-copyright", "0"]
# Written from the version being built rather than kept in the repository, so
# it can never drift from the package it describes.
changelog = "../../packaging/changelog.Debian"
section = "utils"
priority = "optional"
# Line breaks are kept as written: a Debian description is a folded field
# where every line travels as it stands, so wrapping it here is what keeps it
# readable in a package manager.
extended-description = """
Favnyr is a lightweight file browser for Windows and Linux. At its core are
workspaces: separate environments that keep their own views, tabs, folders,
layouts, and display settings. You could have one workspace for work, another
for games, and another for learning a new subject, then switch between them in
just two clicks. Favorites remain shared and persistent across all workspaces.

Each workspace can contain multiple split views and movable tabs. Tabs can be
dragged between views, detached, or dropped onto another view to create a new
split layout.

Favnyr also includes shortcuts, local and network drives, configurable keyboard
shortcuts, and custom commands."""
# Resolved by dpkg-shlibdeps from the binary itself, which is why the package
# has to be built where it will be installed: a library floor read on a newer
# distribution would be wrong for an older one.
depends = "$auto"
# Each one widens what Favnyr can do without being needed to start it: video
# and PDF thumbnails, then the archive recipes. The alternative covers the
# 7-Zip package being renamed between releases.
suggests = "ffmpeg, poppler-utils, 7zip | p7zip-full"
assets = [
    ["target/release/favnyr", "usr/bin/", "755"],
    ["../../packaging/favnyr.desktop", "usr/share/applications/", "644"],
    [
        "assets/favnyr.svg",
        "usr/share/icons/hicolor/scalable/apps/favnyr.svg",
        "644",
    ],
]

# RPM description, read by the `cargo generate-rpm` tool. Same arrangement as
# the Debian one above: installed on the side, absent from `Cargo.lock`, and
# fed by the binary built once for both formats.
#
# The licence travels in full here, unlike in the Debian package: an RPM
# distribution expects every package to carry its own licence text under
# `/usr/share/licenses`, where Debian expects a reference to a shared copy.
[package.metadata.generate-rpm]
name = "favnyr"
summary = "Modern and lightweight file manager"
assets = [
    { source = "target/release/favnyr", dest = "/usr/bin/favnyr", mode = "755" },
    { source = "../../packaging/favnyr.desktop", dest = "/usr/share/applications/favnyr.desktop", mode = "644" },
    { source = "assets/favnyr.svg", dest = "/usr/share/icons/hicolor/scalable/apps/favnyr.svg", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/favnyr/LICENSE", mode = "644", doc = true },
]
