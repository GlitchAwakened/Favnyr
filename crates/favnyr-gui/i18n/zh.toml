# Language: zh (Simplified Chinese / 简体中文). Missing keys fall back to English (en.toml).
#
# FIRST DRAFT, NOT REVIEWED BY A NATIVE SPEAKER.
# It exists so a volunteer has something to correct rather than 480 blank
# lines. The glossary below is where the decisions live: correcting a line
# here is worth more than correcting the strings that follow from it.
#
#   file             文件
#   folder           文件夹
#   tab              标签页
#   pane             窗格        (a split area holding tabs)
#   display settings 显示        (as in 显示选项)
#   workspace        工作区
#   thumbnail        缩略图
#   preview          预览        (only ow_preview: it labels a command line)
#   trash            回收站
#   favorites        收藏夹
#   open with        打开方式
#   file shortcut    快捷方式    /  key shortcut  快捷键
#   sidebar shortcuts 快速访问
#   compress         压缩        /  extract  解压
#   note             备注
#
# 窗格 is the pane, which the English also calls a "view". 视图 describes a
# display mode in Chinese, not the split area that holds tabs.
#
# Register: concise noun and verb forms for labels and buttons, plain
# sentences for hints. Full-width punctuation throughout, and no —— as a
# bare separator where a comma or a 、 does the work.

