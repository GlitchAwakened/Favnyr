# Language: ja (Japanese / 日本語). Missing keys fall back to English (en.toml).
#
# FIRST DRAFT, NOT REVIEWED BY A NATIVE SPEAKER.
# It exists so a volunteer has something to correct rather than 480 blank
# lines. The glossary below is where the decisions live: correcting a line
# here is worth more than correcting the fifty strings that follow from it.
#
#   file            ファイル
#   folder          フォルダー   (long vowel, current Windows style)
#   tab             タブ
#   view / pane     ビュー       (display settings use 表示, so no clash)
#   workspace       ワークスペース
#   thumbnail       サムネイル
#   preview         プレビュー   (only ow_preview: it labels a command line)
#   trash           ごみ箱
#   favorites       お気に入り
#   open with       プログラムから開く
#   archive         アーカイブ
#   compress        圧縮        /  extract  展開
#   modified (col)  更新日時
#   rename          名前の変更
#   paste           貼り付け     /  cut  切り取り
#
# Register: noun forms for labels and buttons, plain polite sentences for
# hints. No honorifics, no exclamation marks.

