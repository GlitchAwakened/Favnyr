# Language: ru (Russian / русский). Missing keys fall back to English (en.toml).
#
# REVIEWED BY A NATIVE SPEAKER. The three decisions below are theirs, and two
# of them deliberately depart from the English wording: do not "fix" them to
# match.
#
#   1. thumbnail is превью, not миниатюра. The English term changed from
#      "preview" to "thumbnail"; Russian keeps превью, which is what Russian
#      interfaces call it.
#   2. the tab bar is панель вкладок, not строка вкладок. Панель
#      therefore serves both the bar and a split pane, which they accept.
#   3. ё is written out, never spelled е. Any new string follows that rule.
#
#   file             файл
#   folder           папка
#   tab              вкладка
#   pane / tab bar   панель
#   list / grid      список / сетка
#   thumbnail        превью
#   workspace        рабочее пространство
#   favorites        избранное
#   trash            корзина
#   open with        открыть с помощью
#   age              возраст     (confirmed as a column name)

