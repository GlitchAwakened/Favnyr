schema_version = 1

# Light uses cool gray surfaces, blue focus and the original muted accents.
# Notification tints and unspecified contrasting inks use the shared resolver.
[light.opacity]
hidden = 0.58
age = 0.16

[light.colors]
background = "#DCDEE3"
surface = "#E6E7ED"
toolbar = "#D6D8DF"
