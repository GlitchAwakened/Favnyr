schema_version = 1

# Light: content on bg, side bars and headers on bg2, bg0 behind them, neutral
# hover on bg3 rather than bg4, which leaves body text below a readable
# contrast, and separators on bg5. The aqua accent carries dark text, since
# the upstream light ink does not reach a readable contrast on it.
#
# The neutral surfaces are desaturated to about 40% of the upstream tint. Every
# one of them carried a 23 to 26 point yellow cast, which read as a film laid
# over the whole window rather than as warm paper. Compression is done at
# constant luminance, so the text contrasts are the ones measured before it.
[light.opacity]
hidden = 0.58
age = 0.16

[light.colors]
background = "#EEEDE4"
surface = "#F9F6EF"
toolbar = "#F0EFE6"
alternate_background = "#EBEAE1"
foreground = "#5C6A72"
border = "#DCDBD3"
accent_background = "#6EC398"
accent_foreground = "#2F383E"
danger = "#F85552"
success = "#899C40"
warning = "#BF983D"
extension = "#5A93A2"
track = "#E2E1D9"
disk_normal = "#A4AD9E"
toast_success = "#F0F1D2"
toast_info = "#E9F0E9"
toast_danger = "#FBE3DA"
tooltip_background = "#5C6A72"
tooltip_foreground = "#F9F6EF"
shadow = "#000000"
modal_overlay = "#5C6A7273"
file_application = "#899C40"
file_archive = "#F57D26"
file_audio = "#B87B9D"
file_document = "#5A93A2"
file_image = "#F85552"
file_video = "#569D79"
file_registry = "#879686"
folder_default = "#BF983D"
folder_red = "#F85552"
folder_green = "#899C40"
folder_teal = "#569D79"
folder_blue = "#5A93A2"
folder_violet = "#B87B9D"
folder_pink = "#E092BE"
folder_slate = "#879686"
age_hour = "#F85552"
age_hours = "#F57D26"
age_day = "#BF983D"
age_week = "#899C40"
age_month = "#569D79"
age_year = "#5A93A2"
