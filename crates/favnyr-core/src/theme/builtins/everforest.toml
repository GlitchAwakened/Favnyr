# Dark: content on bg, lighter side bars and headers on bg2, bg0 behind them,
# neutral hover on bg4 and separators on bg5. Colored fills carry the bg0 ink.
#
# Two desaturations, also at constant luminance. The surfaces lose part of
# their cool tint, and the body text loses most of its warm one: a 41 point
# beige over cold grey-green surfaces was the real source of the muddiness,
# more than the surfaces themselves. Green remains where it means something,
# in the accent and in the palette's own colours.
[dark.opacity]
hidden = 0.55
age = 0.20

[dark.colors]
background = "#24282A"
surface = "#32373B"
toolbar = "#3B4144"
alternate_background = "#4E5458"
foreground = "#CEC6B7"
border = "#555B5F"
accent_background = "#569D79"
accent_foreground = "#24282A"
danger = "#E67E80"
danger_foreground = "#24282A"
success = "#A7C080"
warning = "#DBBC7F"
extension = "#7FBBB3"
toast_success = "#404D44"
toast_info = "#394F5A"
toast_danger = "#4E3E43"
tooltip_background = "#24282A"
tooltip_foreground = "#CEC6B7"
shadow = "#000000"
modal_overlay = "#24282A99"
file_application = "#A7C080"
file_archive = "#E69875"
file_audio = "#D699B6"
file_document = "#7FBBB3"
file_image = "#E67E80"
