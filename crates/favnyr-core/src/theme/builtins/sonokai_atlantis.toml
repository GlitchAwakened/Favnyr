# Original blue-gray Atlantis surfaces and cyan accent. Teal and pink are
# intermediate hues for folder slots. Metadata uses lighter colors where
# needed, with a restrained age tint to preserve readability.
[dark.opacity]
hidden = 0.55
age = 0.10

[dark.colors]
