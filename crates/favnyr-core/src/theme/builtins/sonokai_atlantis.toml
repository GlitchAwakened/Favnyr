schema_version = 1

# Cool paper surfaces and deeper Atlantis hues keep colored text legible.
# Notification backgrounds and ink on colored fills use the shared resolver.
[light.opacity]
hidden = 0.58
age = 0.10

[light.colors]
background = "#E3E8EF"
surface = "#F6F8FA"
toolbar = "#EDF1F5"
alternate_background = "#DCE3EC"
foreground = "#2A2F38"
border = "#BBC5D3"
accent_background = "#176780"
accent_foreground = "#FFFFFF"
danger = "#B52F4D"
