schema_version = 1

# Latte adaptation: a faint cool tint on neutral surfaces and a muted mauve accent.
# Notification tints and unspecified contrasting inks use the shared resolver.
[light.opacity]
hidden = 0.58
age = 0.16

[light.colors]
background = "#E1E5F0"
