# The original Rose Pine variant, not Moon. Pine remains a folder color;
# document and age labels use a brighter blue for readability. Leaf provides
# a distinct green slot, while the selection uses the upstream rose accent.
[dark.opacity]
hidden = 0.55
age = 0.10

