schema_version = 1

# Dawn's warm paper and rose accent retain their original colors. Small
# age labels use deeper shades; pastel folder fills keep the original hues.
# Notification backgrounds and ink on colored fills use the shared resolver.
[light.opacity]
hidden = 0.58
age = 0.10

[light.colors]
background = "#F2E9E1"
surface = "#FAF4ED"
toolbar = "#FFFAF3"
alternate_background = "#F2E9E1"
foreground = "#464261"
border = "#CECACD"
accent_background = "#D7827E"
