# Fluvy light and dark palettes, adapted to application semantic roles.
# Original Fluvy theme by acosta290.
# Colors are taken from the generated Sand palette of the Fluvy theme, which is
# distributed under the GNU General Public License version 3, as is this
# application. Only color values are reused.

schema_version = 1

# Light: content on the card color, side bars and headers on the page color,
# the sunken page behind them. Hover uses the caramel accent tint. File types,
# folders and ages use the domain state inks.
[light.opacity]
hidden = 0.58
age = 0.16

[light.colors]
background = "#E6E0D6"
surface = "#FFFDFA"
toolbar = "#EFE9DF"
