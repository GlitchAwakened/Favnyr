schema_version = 1

# Hard light content, warm secondary surfaces and a deep orange accent.
# Age labels use darker shades on their tinted badges. Notification backgrounds
# and ink on colored fills use the shared resolver.
[light.opacity]
hidden = 0.58
age = 0.10

[light.colors]
background = "#EBDBB2"
surface = "#F9F5D7"
toolbar = "#FBF1C7"
alternate_background = "#EBDBB2"
foreground = "#3C3836"
border = "#BDAE93"
accent_background = "#AF3A03"
accent_foreground = "#F9F5D7"
danger = "#9D0006"
danger_foreground = "#F9F5D7"
success = "#79740E"
warning = "#B57614"
extension = "#0A6374"
track = "#D5C4A1"
disk_normal = "#BDAE93"
tooltip_background = "#3C3836"
tooltip_foreground = "#F9F5D7"
shadow = "#1D2021"
modal_overlay = "#1D202173"
file_application = "#79740E"
file_archive = "#AF3A03"
file_audio = "#8F3F71"
file_document = "#076678"
file_image = "#9D0006"
