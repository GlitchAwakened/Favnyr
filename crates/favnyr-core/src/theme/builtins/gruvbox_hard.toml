# Hard dark content with warm charcoal chrome and an orange accent. Pink
# extends the upstream purple toward red; small metadata uses lighter shades
# where necessary to retain contrast on tinted or selected rows.
[dark.opacity]
hidden = 0.55
age = 0.10

[dark.colors]
